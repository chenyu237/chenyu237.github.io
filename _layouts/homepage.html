---
layout: default
---

{% include crest-filters.html %}
<div id="main" role="main" class="personal-homepage">
  {% include sidebar.html %}
  <article class="page profile-page" aria-labelledby="about-me">
    <div class="page__inner-wrap">
      <header>
        <h1 id="about-me" class="page__title">{% if page.title_icon %}<span class="profile-section-icon" aria-hidden="true">{{ page.title_icon | escape }}</span> {% endif %}{{ page.title }}</h1>
      </header>
      <div class="page__content">
        {{ content }}
      </div>
    </div>
  </article>
</div>
